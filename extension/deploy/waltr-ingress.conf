# Drop-in snippet for the Waltr team's nginx/ingress.
# Add inside the existing `server { ... }` block that serves app.waltr.in.
#
# Requires: the `water-forecast-web` container is reachable from Waltr's nginx.
# If Waltr's compose project is separate, attach both to a shared docker network:
#
#   # in Waltr's compose
#   networks:
#     water-forecast:
#       external: true
#
#   services:
#     nginx:
#       networks: [default, water-forecast]
#
# and in our deploy/docker-compose.yml the default network is named
# `water-forecast_default` (compose auto-names `<project>_default`).

location = /forecast        { return 308 /forecast/; }

location /forecast/ {
    proxy_pass http://water-forecast-web:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Preserve the Waltr session for same-origin SSO.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie        $http_cookie;

    # WebSocket upgrade (Next.js dev HMR; harmless in prod).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 120s;
    proxy_buffering    off;
}

# Optional static asset cache — speeds up repeat loads of the forecast SPA.
location /forecast/_next/static/ {
    proxy_pass http://water-forecast-web:3000/_next/static/;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
