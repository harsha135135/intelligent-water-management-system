# Fronts the Next.js `web` service.
# In the final Waltr topology this nginx is optional — Waltr's own ingress proxies
# /forecast/* to the `web` container on the internal network. This config is for
# standalone subdomain deployments (forecast.pes.edu) and local smoke testing.

upstream water_forecast_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uncomment once TLS is issued; keep port 80 only for ACME challenges.
    # return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://water_forecast_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

