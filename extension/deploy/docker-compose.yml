# Compose for the water-forecast extension.
# Run from repo root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d

name: water-forecast

x-api-env: &api-env
  PROJECT_ROOT: /srv/water
  DATASET_DIR: /srv/water/dataset
  RESULTS_DIR: /srv/water/results
  MODELS_SRC_DIR: /srv/water/src/models
  RUNTIME_DIR: /srv/water/runtime
  INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?must be set}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  WALTR_BASE_URL: ${WALTR_BASE_URL:-https://api.waltr.in}
  WALTR_DEFAULT_LOCATION_ID: ${WALTR_DEFAULT_LOCATION_ID:-638}
  WALTR_SERVICE_TOKEN: ${WALTR_SERVICE_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: water_forecast
      POSTGRES_USER: water
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water_forecast"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: water-forecast-api:latest
    restart: unless-stopped
    environment: *api-env
    volumes:
      - ${DATA_ROOT:-/srv/water}:/srv/water
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose:
      - "8000"

  worker:
    image: water-forecast-api:latest
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    environment: *api-env
    volumes:
      - ${DATA_ROOT:-/srv/water}:/srv/water
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    image: water-forecast-api:latest
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment: *api-env
    volumes:
      - ${DATA_ROOT:-/srv/water}:/srv/water
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: water-forecast-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?must be set}
      WALTR_JWKS_URL: ${WALTR_JWKS_URL:-}
      WALTR_JWT_ISSUER: ${WALTR_JWT_ISSUER:-}
      WALTR_JWT_AUDIENCE: ${WALTR_JWT_AUDIENCE:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/forecast}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./tls}:/etc/nginx/tls:ro
    depends_on:
      - web

volumes:
  redis-data:
  postgres-data:
